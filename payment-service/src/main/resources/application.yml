server:
  port: 8084

spring:
  application:
    name: payment-service
  profiles:
    active: dev
  config:
    import: optional:nacos:payment-service-dev.yaml
  cloud:
    nacos:
      config:
        server-addr: 38.76.188.242:8848
        namespace: dev-zhaoshihang
        username: nacos
        password: jianjiange
        file-extension: yaml
        refresh-enabled: true

  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-init-sql: SET TIME ZONE 'UTC'

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    table: flyway_history_payment

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

grpc:
  server:
    port: 9093
    enable-keepalive: true
    keepalive-time: 30s
    keepalive-timeout: 5s

logging:
  level:
    com.dating: DEBUG
    com.baomidou: INFO
