server:
  port: 8081

spring:
  application:
    name: user-service
  profiles:
    active: dev
  config:
    import: nacos:user-service-dev.yaml
  cloud:
    nacos:
      config:
        server-addr: 38.76.188.242:8848
        namespace: dev-zhaoshihang
        username: nacos
        password: jianjiange
        file-extension: yaml
        refresh-enabled: true

  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-init-sql: SET TIME ZONE 'UTC'

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    table: flyway_history_user              # 独立历史表，不和其他服务冲突

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath:mapper/*.xml

grpc:
  server:
    port: 9091                               # 与 post-service(9090) 错开
    enable-keepalive: true
    keepalive-time: 30s
    keepalive-timeout: 5s

logging:
  level:
    com.dating: DEBUG
    com.baomidou: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
