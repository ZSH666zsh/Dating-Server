server:
  port: 8081

spring:
  application:
    name: post-service
  profiles:
    active: dev
  config:
    import: nacos:post-service-dev.yaml  # 从 Nacos 拉远程配置（密码等敏感信息）
  cloud:
    nacos:
      config:
        server-addr: 38.76.188.242:8848
        namespace: dev-zhaoshihang
        username: nacos
        password: jianjiange
        file-extension: yaml
        refresh-enabled: true

  # 数据源占位，实际值由 application-dev.yml / Nacos 覆盖
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-init-sql: SET TIME ZONE 'UTC'

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    table: flyway_history_post

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath:mapper/*.xml

# gRPC 服务器
grpc:
  server:
    port: 9091
    enable-keepalive: true
    keepalive-time: 30s
    keepalive-timeout: 5s

# 日志 stdout，由 Promtail 采集到 Loki
logging:
  level:
    com.dating: DEBUG
    com.baomidou: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{traceId}] - %msg%n"

# dating-common 对象存储（MinIO）
dating:
  object-storage:
    provider: s3
    endpoint: https://minio-api.jianjiange.site
    region: us-east-1
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    path-style-access: true
    bucket: dating-zhaoshihang

# RocketMQ：Feed 写扩散（发帖 → 关注者 timeline）
# AK/SK 为共享教学机凭据（0学员指导 §6.6），可用环境变量覆盖；
# 消费端可用 post.fanout.enabled=false 关掉（无 RocketMQ 环境不阻塞启动）
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:38.76.188.242:9876}
  producer:
    group: dev_zhaoshihang_post_fanout_producer
    access-key: ${ROCKETMQ_ACCESS_KEY:rocketmq-student}
    secret-key: ${ROCKETMQ_SECRET_KEY:5cafa390b8a42c25}
  consumer:
    access-key: ${ROCKETMQ_ACCESS_KEY:rocketmq-student}
    secret-key: ${ROCKETMQ_SECRET_KEY:5cafa390b8a42c25}

post:
  fanout:
    enabled: true
    topic: dev_zhaoshihang_post_fanout_v1        # 按约定先到 RocketMQ Dashboard 建 topic
    consumer-group: dev_zhaoshihang_post_fanout_consumer
    timeline-max: 100
